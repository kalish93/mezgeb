<!doctype html>
<html lang="am" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21633b">
  <title>መዝገብ — ኢንተርኔት የለም</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f7f4; color: #17221e;
           font-family: 'Noto Sans Ethiopic', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    .card { max-width: 380px; background: #fff; border: 1px solid #dfe9e1; border-radius: 24px; padding: 32px 24px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #77867d; font-size: 14px; line-height: 1.6; margin: 4px 0; }
    button { margin-top: 20px; background: #21633b; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.svg" alt="">
    <h1>ኢንተርኔት የለም</h1>
    <p>መዝገብ መረጃውን ከሰርቨሩ ያመጣል። ግንኙነቱ ሲመለስ እንደገና ይሞክሩ።</p>
    <p>No internet connection. Mezgeb needs the server for its data — try again when you're back online.</p>
    <button onclick="location.reload()">እንደገና ሞክር · Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
